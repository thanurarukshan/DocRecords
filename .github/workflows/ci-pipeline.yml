name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Node.js (for backend + frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Install dependencies for backend microservices
      - name: Install backend dependencies
        run: |
          cd backend/api-gateway && npm install && cd -
          cd backend/auth-service && npm install && cd -
          cd backend/patient-service && npm install && cd -
          cd backend/prescription-service && npm install && cd -
          cd backend/profile-control-service && npm install && cd -

      # Install dependencies for frontend (React/Next.js/etc.)
      - name: Install frontend dependencies
        run: |
          cd frontend && npm install && cd -

      # Start backend services
      - name: Start backend services
        run: |
          nohup node backend/auth-service/src/server.js > backend/auth-service/auth.log 2>&1 &
          nohup node backend/patient-service/src/server.js > backend/patient-service/patient.log 2>&1 &
          nohup node backend/prescription-service/src/server.js > backend/prescription-service/prescription.log 2>&1 &
          nohup node backend/profile-control-service/src/server.js > backend/profile-control-service/profile.log 2>&1 &
          nohup node backend/api-gateway/src/server.js > backend/api-gateway/gateway.log 2>&1 &
          sleep 20

      # Start frontend service
      - name: Start frontend
        run: |
          cd frontend
          nohup npm start > frontend/frontend.log 2>&1 &
          cd ..
          sleep 20

      # Health checks for backend + frontend
      - name: Verify services are running
        run: |
          set -e
          echo "Checking API Gateway..." && curl -f http://localhost:5000 || (cat backend/api-gateway/*.log && exit 1)
          echo "Checking Auth Service..." && curl -f http://localhost:5001 || (cat backend/auth-service/*.log && exit 1)
          echo "Checking Patient Service..." && curl -f http://localhost:5002 || (cat backend/patient-service/*.log && exit 1)
          echo "Checking Prescription Service..." && curl -f http://localhost:5003 || (cat backend/prescription-service/*.log && exit 1)
          echo "Checking Profile Control Service..." && curl -f http://localhost:5004 || (cat backend/profile-control-service/*.log && exit 1)
          echo "Checking Frontend..." && curl -f http://localhost:3000 || (cat frontend/*.log && exit 1)
